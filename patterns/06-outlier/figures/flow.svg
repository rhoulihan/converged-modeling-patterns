<svg class="fig" viewBox="0 0 560 332" role="img" aria-label="Advisor and client tables feed a duality view for document consumers and one top-N query for the book screen, with no application branch" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper:#F6F8F9;--panel:#FFFFFF;--ink:#1C2733;--muted:#5A6B7C;--faint:#8B99A7;--hairline:#D8DEE4;--hot:#B3372B;--hot-soft:rgba(179,55,43,.10);--cool:#0E8A63;--cool-soft:rgba(14,138,99,.10);--flow:#2563EB;--flow-soft:rgba(37,99,235,.10);--chip:#EDF1F4;}@media (prefers-color-scheme: dark){svg{--paper:#131A22;--panel:#1A232E;--ink:#E8EDF2;--muted:#93A3B4;--faint:#6B7B8C;--hairline:#26313D;--hot:#E06552;--hot-soft:rgba(224,101,82,.14);--cool:#21A57F;--cool-soft:rgba(33,165,127,.14);--flow:#60A5FA;--flow-soft:rgba(96,165,250,.16);--chip:#222D39;}}</style><defs><marker id="dk278f1c23-varmuted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="dk278f1c23-varflow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs><text x="91.0" y="30.0" font-size="10.5" font-family="IBM Plex Mono, monospace" font-weight="600" fill="var(--faint)" text-anchor="middle">RELATIONAL PROJECTION</text><text x="295.0" y="30.0" font-size="10.5" font-family="IBM Plex Mono, monospace" font-weight="600" fill="var(--faint)" text-anchor="middle">SAME ROWS, TWO READS</text><text x="482.0" y="30.0" font-size="10.5" font-family="IBM Plex Mono, monospace" font-weight="600" fill="var(--faint)" text-anchor="middle">CONSUMERS</text><rect x="18.0" y="70.0" width="148.0" height="56.0" rx="6" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><rect x="18.0" y="70.0" width="4" height="56.0" rx="2" fill="var(--ink)"/><text x="94.0" y="94.1" font-size="13" font-family="Bricolage