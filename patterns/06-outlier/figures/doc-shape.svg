<svg class="fig" viewBox="0 0 560 372" role="img" aria-label="The advisor document as built: the client book embedded as an array, with a hasExtras flag for the books that overflow" xmlns="http://www.w3.org/2000/svg"><style>svg{--paper:#F6F8F9;--panel:#FFFFFF;--ink:#1C2733;--muted:#5A6B7C;--faint:#8B99A7;--hairline:#D8DEE4;--hot:#B3372B;--hot-soft:rgba(179,55,43,.10);--cool:#0E8A63;--cool-soft:rgba(14,138,99,.10);--flow:#2563EB;--flow-soft:rgba(37,99,235,.10);--chip:#EDF1F4;}@media (prefers-color-scheme: dark){svg{--paper:#131A22;--panel:#1A232E;--ink:#E8EDF2;--muted:#93A3B4;--faint:#6B7B8C;--hairline:#26313D;--hot:#E06552;--hot-soft:rgba(224,101,82,.14);--cool:#21A57F;--cool-soft:rgba(33,165,127,.14);--flow:#60A5FA;--flow-soft:rgba(96,165,250,.16);--chip:#222D39;}}</style><defs></defs><rect x="18.0" y="18.0" width="330.0" height="328.5" rx="8" fill="var(--panel)" stroke="var(--hairline)" stroke-width="1.4"/><text x="30.0" y="36.0" font-size="10.5" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" fill="var(--faint)" text-anchor="start">advisors · one document per book</text><text x="30.0" y="58.0" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">{</text><text x="43.4" y="77.5" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">&quot;_id&quot;: &quot;A-900&quot;,</text><text x="43.4" y="97.0" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">&quot;name&quot;: &quot;Institutional Desk 4&quot;,</text><text x="43.4" y="116.5" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="400" fill="var(--ink)" text-anchor="start">&quot;bookType&quot;: &quot;team&quot;,</text><rect x="20" y="122.0" width="326" height="19.5" fill="var(--hot-soft)"/><text x="43.4" y="136.0" font-size="11" font-family="IBM Plex Mono,