<!-- app/public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converged Modeling Lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="/css/lab.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="logo-chip"><img class="oracle-logo" src="/brand/oracle-logo.svg" alt="Oracle"></span><span class="lab-name">Converged Modeling Lab</span></a>
  <span class="product">Oracle AI Database 26ai</span>
  <span class="who" id="who"></span>
</header>
<main id="view" aria-live="polite"></main>
<section id="console" aria-label="Console">
  <div class="bar">
    <button type="button" class="dock-toggle" id="dock-toggle" aria-expanded="false" aria-controls="console-panes">▲ Console</button>
    <div class="tabs" role="tablist">
      <button type="button" data-lane="sql" class="on">SQL</button>
      <button type="button" data-lane="mongo">MongoDB</button>
    </div>
    <button type="button" class="btn primary" id="run">Run ⌘/Ctrl+Enter</button>
    <button type="button" class="btn" id="history">History</button>
    <span class="status" id="status">ready</span>
    <button type="button" class="dock-pin" id="dock-pin" aria-pressed="false" aria-label="Pin the console open" title="Keep the console open">📌</button>
  </div>
  <div class="panes" id="console-panes">
    <div class="editor" id="editor-sql"></div>
    <div class="editor" id="editor-mongo" hidden></div>
    <div class="out" id="out"></div>
  </div>
</section>
<script type="module" src="/js/app.js"></script>
</body>
</html>
