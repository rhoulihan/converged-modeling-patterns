name: converged-modeling-patterns

# One service: Oracle AI Database 26ai Free + ORDS + the Oracle API for MongoDB,
# built fresh from ./docker (see docker/Dockerfile). Exposes SQL (1521), ORDS
# (8181), and the Mongo wire protocol (27017). Host ports default to NON-standard
# values so this never collides with another Oracle/ORDS/Mongo stack on the host;
# run.sh drives everything in-container, so the host mapping is only for your own
# clients. Override with CMP_PORT / CMP_ORDS_PORT / CMP_MONGO_PORT.
#
# Every host port binds to 127.0.0.1 by default. The database ports stay there even in
# event mode: publishing them to the room would hand attendees LAB_ADMIN and SYS.
# Only the console is opened up for an event (CMP_UI_BIND=0.0.0.0).
services:
  oracle:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: converged-modeling-patterns-oracle:latest
    container_name: cmp-oracle
    ports:
      - '${CMP_DB_BIND:-127.0.0.1}:${CMP_PORT:-1522}:1521'          # SQL*Net
      - '${CMP_DB_BIND:-127.0.0.1}:${CMP_ORDS_PORT:-8182}:8181'     # ORDS / Database Actions
      - '${CMP_DB_BIND:-127.0.0.1}:${CMP_MONGO_PORT:-27018}:27017'  # Oracle API for MongoDB
    environment:
      ORACLE_PASSWORD: '${ORACLE_PASSWORD:-Sandbox2026}'   # SYS / SYSTEM
      APP_USER: 'CMP_USER'
      APP_USER_PASSWORD: '${CMP_PASSWORD:-CmpUser2026}'
    healthcheck:
      # DB readiness only; run.sh polls ORDS + Mongo itself before the Mongo lane.
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 180s
    volumes:
      - cmp-data:/opt/oracle/oradata

  lab-ui:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: runtime
    image: converged-modeling-patterns-lab-ui:latest
    container_name: cmp-lab-ui
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - '${CMP_UI_BIND:-127.0.0.1}:${CMP_UI_PORT:-3100}:3000'  # hands-on console; event mode: CMP_UI_BIND=0.0.0.0
      - '127.0.0.1:${CMP_PUBLIC_PORT:-3101}:3001'  # attendee side only, for a public tunnel (docs/remote-access.md); localhost only
    environment:
      LAB_MODE: '${LAB_MODE:-solo}'           # solo | event
      PUBLIC_PORT: '3001'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'   # required when LAB_MODE=event
      EVENT_CODE: '${EVENT_CODE:-}'
      ORACLE_PASSWORD: '${ORACLE_PASSWORD:-Sandbox2026}'
      CMP_PASSWORD: '${CMP_PASSWORD:-CmpUser2026}'
      LAB_ADMIN_PASSWORD: '${LAB_ADMIN_PASSWORD:-LabAdmin2026}'
      DB_POOL_MAX: '${DB_POOL_MAX:-1}'
      MONGO_POOL_MAX: '${MONGO_POOL_MAX:-1}'

  lab-ui-test:
    profiles: ['test']
    build:
      context: .
      dockerfile: app/Dockerfile
      target: test
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_HOST: oracle
      DB_PORT: '1521'
      MONGO_HOST: oracle
      MONGO_PORT: '27017'
      ORACLE_PASSWORD: '${ORACLE_PASSWORD:-Sandbox2026}'
      CMP_PASSWORD: '${CMP_PASSWORD:-CmpUser2026}'
      # Same value lab-ui uses: the tests' bootstrap re-sets LAB_ADMIN's password to this.
      LAB_ADMIN_PASSWORD: '${LAB_ADMIN_PASSWORD:-LabAdmin2026}'

volumes:
  cmp-data:
